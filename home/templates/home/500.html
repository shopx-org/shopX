{% extends "base.html" %}
{% load static %}
{% load imagekit %}

{% block title %}خطای 500{% endblock %}

{% block meta_description %}
    <meta name="description" content="خطای 500 - خطای داخلی سرور">
{% endblock %}

{% block content %}
    <main class="main">
        <div class="error-content">
            <div class="container">

                <img src="{% static 'images/error.png' %}"
                     alt="خطای 500 - خطای داخلی سرور"
                     class="error-image">

                <h1 class="error-title">خطای 500</h1>

                <p class="error-text">
                    مشکلی در سرور رخ داده است. لطفاً چند دقیقه بعد دوباره تلاش کنید.
                </p>

                <a href="{% url 'home:home' %}" class="btn-home">
                    بازگشت به صفحه اصلی
                </a>

            </div>
        </div>
    </main>
{% endblock %}
